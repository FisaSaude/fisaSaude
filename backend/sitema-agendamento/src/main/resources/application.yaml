spring:
  application:
    name: sitema-agendamento
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:pilates}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: America/Sao_Paulo

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    persist-authorization: true
  show-login-endpoint: true

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  notificacao:
    base-url: ${NOTIFICACAO_BASE_URL:http://localhost:8081}
    internal-api-key: dev123

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}
  feriados:
    url: ${URL_FERIADOS:https://brasilapi.com.br/api/feriados/v1}