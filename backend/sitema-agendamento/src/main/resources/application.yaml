spring:
  application:
    name: sitema-agendamento
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:pilates}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: America/Sao_Paulo

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    persist-authorization: true
  show-login-endpoint: true

app:
  notifications:
    timezone: America/Sao_Paulo
    lembrete-cron: "0 0 15 * * ?"
    retry-fixed-rate-ms: 3600000
    max-send-attempts: 3
    twilio-enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    establishment-alert-to: ${TWILIO_ALERT_RECEPCAO:}

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}
  feriados:
    url: ${URL_FERIADOS:https://brasilapi.com.br/api/feriados/v1}