# Perfil usado por @SpringBootTest (smoke). Não depende de MySQL/credenciais locais.
spring:
  datasource:
    url: jdbc:h2:mem:fisasaude_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

app:
  internal:
    api-key: ""
