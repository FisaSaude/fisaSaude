spring:
  datasource:
    url: jdbc:h2:mem:notiftest;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  notifications:
    twilio-enabled: false
  internal:
    api-key: ""
  integracao:
    agendamento:
      base-url: http://127.0.0.1:9
      internal-api-key: ""
